<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>NABS Track Editor</title>
    <!--
      For the search snippet. The page is deliberately not linked from any
      public page on the site (its card on /tools is admins-only), but it IS
      in sitemap.xml and meant to be findable through a search engine — see
      backend/src/lib/sitemap.js. Without this, Google invents a snippet from
      whatever text the app happens to render first.
    -->
    <meta
      name="description"
      content="A free 3D track editor for Assetto Corsa that runs entirely in your browser. Draw the racing line, sculpt the terrain, place kerbs, barriers and pits, then export a finished .kn5 track ready to drive."
    />
    <script>
      /*
       * React 19's dev build ships a "Components" performance track that, on
       * every commit whose props changed, deep-diffs old against new props for
       * a DevTools tooltip. With the terrain height field (a 37k-entry
       * Float32Array) passed as a prop to ~40 components, that diff ran for
       * SECONDS per sculpt dab and froze the page for the whole brush stroke.
       * The track keys off `typeof console.timeStamp == "function"` once at
       * module load; removing the function before the app loads disables it.
       * Production builds never contain the track, so this is dev-only in
       * effect. Delete this line if you ever want the track in a DevTools
       * recording -- and expect sculpting to freeze while it is back.
       */
      console.timeStamp = undefined;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
