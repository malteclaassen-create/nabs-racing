<script>
// Synthetic but physically plausible Spa telemetry for the mockups.
(function () {
  const L = 7004, N = 701, ds = L / (N - 1);
  const C = [
    { name: "La Source", t: "T1", s: 380, a: 72, b: 70, early: 14, late: 0 },
    { name: "Eau Rouge", t: "T3", s: 1050, a: 268, b: 263, early: 0, late: 0 },
    { name: "Les Combes", t: "T5", s: 2150, a: 128, b: 126, early: 4, late: 0 },
    { name: "Malmedy", t: "T7", s: 2380, a: 152, b: 151, early: 0, late: 0 },
    { name: "Rivage", t: "T8", s: 2850, a: 82, b: 83, early: 0, late: 0 },
    { name: "Pouhon", t: "T10", s: 3500, a: 197, b: 190, early: 0, late: 0 },
    { name: "Fagnes", t: "T12", s: 3950, a: 142, b: 143, early: 0, late: 0 },
    { name: "Stavelot", t: "T15", s: 4450, a: 158, b: 156, early: 0, late: 18 },
    { name: "Blanchimont", t: "T17", s: 5650, a: 291, b: 290, early: 0, late: 0 },
    { name: "Bus Stop", t: "T18", s: 6500, a: 68, b: 67, early: 3, late: 0 },
  ];
  const AB = 30, AA = 8.2, VMAX = 318 / 3.6;
  function lap(side) {
    const v = new Array(N);
    for (let i = 0; i < N; i++) {
      const s = i * ds; let m = VMAX;
      for (const c of C) {
        const vm = (side === "a" ? c.a : c.b) / 3.6;
        const e = side === "b" ? c.early : 0, l = side === "b" ? c.late : 0;
        for (const off of [-L, 0, L]) {
          const sc = c.s + off, d = sc - s;
          let w;
          if (d >= 0) w = Math.sqrt(vm * vm + 2 * AB * Math.max(0, d - e));
          else w = Math.sqrt(vm * vm + 2 * AA * Math.max(0, -d - l) * (1 - Math.min(0.55, (-d) / 2600)));
          if (w < m) m = w;
        }
      }
      v[i] = m;
    }
    // smooth a little
    const sv = v.map((_, i) => { let s = 0, k = 0; for (let j = -1; j <= 1; j++) { const q = v[(i + j + N) % N]; s += q; k++; } return s / k; });
    const t = [0];
    for (let i = 1; i < N; i++) t.push(t[i - 1] + ds / ((sv[i] + sv[i - 1]) / 2));
    const speed = sv.map((x) => x * 3.6);
    const gas = [], brake = [], gear = [];
    for (let i = 0; i < N; i++) {
      const dv = speed[(i + 1) % N] - speed[i];
      if (dv < -1.6) { brake.push(Math.min(100, 55 + (-dv) * 9)); gas.push(0); }
      else if (dv < 0.05 && speed[i] < 300) { brake.push(0); gas.push(Math.max(15, Math.min(70, 30 + speed[i] / 8))); }
      else { brake.push(0); gas.push(100); }
      const g = speed[i] < 95 ? 2 : speed[i] < 135 ? 3 : speed[i] < 175 ? 4 : speed[i] < 215 ? 5 : speed[i] < 255 ? 6 : 7;
      gear.push(g);
    }
    return { speed, t, gas, brake, gear };
  }
  const A = lap("a"), B = lap("b");
  // scale times to target lap times
  const target = { a: 106912, b: 107634 };
  const ka = target.a / 1000 / A.t[N - 1], kb = ka;
  A.t = A.t.map((x) => x * ka); B.t = B.t.map((x) => x * kb);
  { const raw = A.t.map((x, i) => B.t[i] - x), k = (target.b - target.a) / 1000 / raw[N - 1]; B.t = A.t.map((x, i) => x + raw[i] * k); }
  const delta = A.t.map((x, i) => B.t[i] - x);

  // map control points [x, y, frac]
  const P = [[90,330,0],[90,200,.03],[100,95,.048],[125,60,.054],[150,85,.06],[160,160,.09],[170,250,.13],[180,290,.15],[215,270,.165],[330,215,.2],[500,135,.25],[640,75,.29],[690,55,.307],[715,75,.32],[720,110,.34],[780,150,.375],[835,175,.407],[825,205,.42],[775,215,.44],[720,245,.47],[690,300,.5],[715,345,.53],[770,360,.564],[830,385,.6],[880,420,.635],[870,470,.66],[800,495,.7],[600,505,.75],[400,500,.807],[250,485,.87],[160,470,.928],[115,450,.94],[95,400,.97],[90,330,1]];
  function at(f) {

    return [cr(p0[0], p1[0], p2[0], p3[0]), cr(p0[1], p1[1], p2[1], p3[1])];
  }

  function trackPath(tx = (x) => x, ty = (y) => y, from = 0, to = 1) {
    const pts = P.slice(0, -1).filter((p) => p[2] >= from - 1e-9 && p[2] <= to + 1e-9);
    const closed = from === 0 && to === 1;
    const arr = closed ? P.slice(0, -1) : pts;
    const n = arr.length;
    const g = (i) => closed ? arr[(i + n) % n] : arr[Math.max(0, Math.min(n - 1, i))];
    let d = `M${tx(arr[0][0]).toFixed(1)},${ty(arr[0][1]).toFixed(1)}`;
    const last = closed ? n : n - 1;
    for (let i = 0; i < last; i++) {
      const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${tx(c1[0]).toFixed(1)},${ty(c1[1]).toFixed(1)} ${tx(c2[0]).toFixed(1)},${ty(c2[1]).toFixed(1)} ${tx(p2[0]).toFixed(1)},${ty(p2[1]).toFixed(1)}`;
    }
    return d + (closed ? "Z" : "");
  }
  // line chart path for array over index range
  function line(arr, w, h, lo, hi, from = 0, to = N - 1, pad = 2) {
    let d = "";
    for (let i = from; i <= to; i++) {
      const x = ((i - from) / (to - from)) * w;
      const y = pad + (1 - (arr[i] - lo) / (hi - lo)) * (h - 2 * pad);
      d += (i === from ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
    }
    return d;
  }
  function area(arr, w, h, lo, hi, from = 0, to = N - 1, base = lo) {
    const yb = (1 - (base - lo) / (hi - lo)) * h;
    return line(arr, w, h, lo, hi, from, to, 0) + `L${w},${yb.toFixed(1)}L0,${yb.toFixed(1)}Z`;
  }
  const idx = (m) => Math.round(m / ds);
  const fmtLap = (ms) => { const m = Math.floor(ms / 60000), s = (ms % 60000) / 1000; return `${m}:${s.toFixed(3).padStart(6, "0")}`; };
  window.TEL = { L, N, ds, C, A, B, delta, P, at, trackPath, line, area, idx, fmtLap,
    nameA: "Siggsta", nameB: "Maltegoat", colorA: "#F58220", colorB: "#0067C0", lapA: 106912, lapB: 107634 };

  // ---- map rendering ---------------------------------------------------
  // opts: {w,h,pad,mode:'gain'|'plain'|'lines', labels:bool, cursor:idx, road:bool, dark:bool, sectors:bool}
  function map(o) {
    o = Object.assign({ w: 1000, h: 560, pad: 30, mode: 'gain', labels: true, cursor: null, road: true, dark: false, sectors: false, labelSize: 30, width: 1 }, o);
    const sx = (o.w - 2 * o.pad) / 960, sy = (o.h - 2 * o.pad) / 500, sc = Math.min(sx, sy);
    const ox = (o.w - 960 * sc) / 2 - 50 * sc, oy = (o.h - 500 * sc) / 2 - 40 * sc;
    const X = (x) => ox + x * sc, Y = (y) => oy + y * sc;
    const pts = []; for (let i = 0; i < N; i++) { const p = at(i / (N - 1)); pts.push([X(p[0]), Y(p[1])]); }
    const poly = (a, b) => pts.slice(a, b + 1).map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    let s = '';
    const W = o.width;
    if (o.road) s += `<polyline points="${poly(0, N - 1)}" fill="none" stroke="${o.dark ? '#273244' : '#cbd5e1'}" stroke-width="${14 * W}" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${poly(0, N - 1)}" fill="none" stroke="${o.dark ? '#1b2433' : '#343b49'}" stroke-width="${11 * W}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (o.mode === 'gain') {
      const step = 6;
      for (let i = 0; i < N - 1; i += step) {
        const j = Math.min(N - 1, i + step);
        const d = (delta[j] - delta[i]) * 1000 / step; // ms per sample, + = A gaining
        const col = Math.abs(d) < 0.4 ? (o.dark ? '#475569' : '#cbd5e1') : d > 0 ? window.TEL.colorA : window.TEL.colorB;
        const w = Math.abs(d) < 0.4 ? 2.2 : Math.abs(d) < 2 ? 4.2 : Math.abs(d) < 4 ? 5.4 : 6.6;
        s += `<polyline points="${poly(i, j)}" fill="none" stroke="${col}" stroke-width="${w * W}" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
    } else if (o.mode === 'lines') {
      s += `<polyline points="${poly(0, N - 1)}" fill="none" stroke="${window.TEL.colorA}" stroke-width="${2.6 * W}"/>`;
      s += `<polyline points="${pts.map((p, i) => (p[0] + 2.2 * W * Math.sin(i / 25)).toFixed(1) + ',' + (p[1] + 2.2 * W * Math.cos(i / 31)).toFixed(1)).join(' ')}" fill="none" stroke="${window.TEL.colorB}" stroke-width="${2.2 * W}" stroke-dasharray="${6 * W} ${4 * W}"/>`;
    } else {
      s += `<polyline points="${poly(0, N - 1)}" fill="none" stroke="${o.plainColor || '#f4afc6'}" stroke-width="${4 * W}" stroke-linejoin="round"/>`;
    }
    // start/finish
    const sf = pts[0];
    s += `<rect x="${sf[0] - 10 * W}" y="${sf[1] - 2}" width="${20 * W}" height="4" fill="#fff" stroke="#0f172a" stroke-width="1"/>`;
    if (o.sectors) {
      [0.27, 0.70].forEach((f, k) => { const p = pts[Math.round(f * (N - 1))]; s += `<circle cx="${p[0]}" cy="${p[1]}" r="${6 * W}" fill="${o.dark ? '#0f172a' : '#fff'}" stroke="#be185d" stroke-width="2"/><text x="${p[0] + 10 * W}" y="${p[1] - 8 * W}" font-family="JetBrains Mono" font-size="${11 * W}" font-weight="700" fill="#be185d">S${k + 2}</text>`; });
    }
    if (o.labels) {
      const off = { 'La Source': [-6, -18], 'Eau Rouge': [-30, 30], 'Les Combes': [-10, -18], 'Malmedy': [18, 6], 'Rivage': [18, 6], 'Pouhon': [-90, 8], 'Fagnes': [-10, -16], 'Stavelot': [18, 6], 'Blanchimont': [-40, 28], 'Bus Stop': [-20, 30] };
      for (const c of C) {
        const p = pts[idx(c.s)], d0 = off[c.name] || [10, -10], d = o.short ? [d0[0] < -40 ? -70 : d0[0] < 0 ? -20 : d0[0], d0[1] < 0 ? -22 : d0[1] > 20 ? 50 : 14] : d0;
        s += `<circle cx="${p[0]}" cy="${p[1]}" r="${3.2 * W}" fill="${o.dark ? '#fff' : '#0f172a'}"/>`;
        s += `<text x="${p[0] + d[0] * W}" y="${p[1] + d[1] * W}" font-family="Inter" font-weight="700" font-size="${o.labelSize * W * 0.55}" fill="${o.dark ? '#e2e8f0' : '#334155'}" paint-order="stroke" stroke="${o.dark ? '#0f172a' : '#fff'}" stroke-width="${o.short ? 8 : 3}">${o.short ? c.t : c.t + ' ' + c.name}</text>`;
      }
    }
    if (o.cursor != null) {
      const p = pts[o.cursor], q = pts[Math.max(0, o.cursor - 3)];
      s += `<circle cx="${q[0]}" cy="${q[1]}" r="${7 * W}" fill="${window.TEL.colorB}" stroke="#fff" stroke-width="2"/>`;
      s += `<circle cx="${p[0]}" cy="${p[1]}" r="${8 * W}" fill="${window.TEL.colorA}" stroke="#fff" stroke-width="2.5"/>`;
    }
    return { svg: s, pts, X, Y };
  }
  // ---- section numbers used across panels --------------------------------
  const SECTIONS = [
    { n: 1, name: 'La Source', t: 'T1', at: 5, m: 380, lost: 332, kind: 'Braking', facts: ['Maltegoat brakes 14 m earlier', 'Siggsta +15 km/h at the slowest point'] },
    { n: 2, name: 'Eau Rouge', t: 'T3', at: 15, m: 1050, lost: 29, kind: 'Corner speed', facts: ['Siggsta +5 km/h at the slowest point'] },
    { n: 3, name: 'Les Combes', t: 'T5', at: 31, m: 2150, lost: 61, kind: 'Braking', facts: ['Maltegoat brakes 4 m earlier', 'Siggsta +5 km/h at the slowest point'] },
    { n: 4, name: 'Malmedy', t: 'T7', at: 34, m: 2380, lost: 11, kind: '', facts: [] },
    { n: 5, name: 'Rivage', t: 'T8', at: 41, m: 2850, lost: -31, kind: 'Your strength', facts: ['Maltegoat +1 km/h at the slowest point', 'Maltegoat on full throttle 6 m earlier'] },
    { n: 6, name: 'Pouhon', t: 'T10', at: 50, m: 3500, lost: 47, kind: 'Corner speed', facts: ['Siggsta +7 km/h at the slowest point', 'Siggsta +4 km/h on exit'] },
    { n: 7, name: 'Fagnes', t: 'T12', at: 56, m: 3950, lost: 12, kind: '', facts: [] },
    { n: 8, name: 'Stavelot', t: 'T15', at: 64, m: 4450, lost: 94, kind: 'Throttle', facts: ['Siggsta on full throttle 18 m earlier', 'Siggsta +7 km/h on exit'] },
    { n: 9, name: 'Blanchimont', t: 'T17', at: 81, m: 5650, lost: 62, kind: 'Lift', facts: ['Maltegoat lifts for 0.2 s, Siggsta stays flat'] },
    { n: 10, name: 'Bus Stop', t: 'T18', at: 93, m: 6500, lost: 83, kind: 'Corner speed', facts: ['Maltegoat brakes 3 m earlier', 'Siggsta +5 km/h at the slowest point'] },
  ];
  window.TEL.map = map; window.TEL.SECTIONS = SECTIONS;
  // mini speed trace around a corner, both laps; returns svg inner + viewBox

    const bA = idx(c.s) - 12, bB = idx(c.s) - 12 - Math.round((c.early || 0) / 10) - 1;
    const grid = dark ? '#334155' : '#dbe2ec', txt = dark ? '#94a3b8' : '#68758a';
    let s = `<line x1="${pl}" x2="${W - 6}" y1="${pt + ph / 2}" y2="${pt + ph / 2}" stroke="${grid}" stroke-dasharray="2 3"/>`;
    s += `<text x="${pl - 4}" y="${pt + 4}" text-anchor="end" font-size="9" font-family="JetBrains Mono" fill="${txt}">${hi}</text><text x="${pl - 4}" y="${pt + ph}" text-anchor="end" font-size="9" font-family="JetBrains Mono" fill="${txt}">${lo}</text>`;
    const ax = px(idx(c.s)); s += `<line x1="${ax}" x2="${ax}" y1="${pt}" y2="${pt + ph}" stroke="${txt}" stroke-width=".8"/><text x="${ax}" y="${pt - 4}" text-anchor="middle" font-size="9" font-family="JetBrains Mono" fill="${txt}">APEX</text>`;
    [[bA, window.TEL.colorA], [bB, window.TEL.colorB]].forEach(([b, col]) => { const x = px(b); s += `<line x1="${x}" x2="${x}" y1="${pt}" y2="${pt + ph}" stroke="${col}" stroke-opacity=".7"/><circle cx="${x}" cy="${pt}" r="2.5" fill="${col}"/>`; });
    s += `<path d="${path(B)}" fill="none" stroke="${window.TEL.colorB}" stroke-width="2"/><path d="${path(A)}" fill="none" stroke="${window.TEL.colorA}" stroke-width="2" stroke-dasharray="5 4"/>`;
    s += `<text x="${pl}" y="${H - 3}" font-size="9" font-family="JetBrains Mono" fill="${txt}">km/h · dots: brake points</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" class="block w-full">${s}</svg>`;
  };
})();
