<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:"#e7ecf3", card:"#ffffff", surface2:"#f1f5f9", border:"#dbe2ec", dark:"#0f172a", medium:"#334155", light:"#586676", faint:"#68758a",
    primary:{DEFAULT:"#f4afc6", dark:"#ee8bac"}, brand:"#f4afc6", onbrand:"#0f172a", ink:"#0f172a", eyebrow:"#be185d", accent:"#db2777",
    gold:"#EAB308", silver:"#94A3B8", bronze:"#C2410C", link:"#374594", ok:"#046c4e", bad:"#b91c1c", warn:"#92400e", fl:"#701aaf", discord:"#5865F2" },
  fontFamily: { sans:["Inter","system-ui","sans-serif"], display:["Archivo","Inter","sans-serif"], mono:["JetBrains Mono","ui-monospace","monospace"] },
  boxShadow: { card:"0 1px 2px rgba(15,23,42,.06), 0 10px 26px -14px rgba(15,23,42,.28)", lift:"0 2px 6px rgba(15,23,42,.08), 0 18px 40px -16px rgba(15,23,42,.34)" }
}}}
</script>
<style>body{background:#e7ecf3;color:#0f172a;font-family:Inter,system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#be185d;font-weight:600}
#mock{padding-top:32px;padding-bottom:32px}</style>
</head><body>
<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">

<section class="relative overflow-hidden rounded-2xl bg-card shadow-card">
  <div class="flex flex-wrap items-center gap-x-4 gap-y-3 px-4 py-3 sm:px-5">
    <div class="flex min-w-0 items-center gap-2.5">
      <img src="/flags/w40/it.png" alt="" class="shrink-0 rounded-[2px] object-cover " style="width:22px;height:16px">
      <h2 class="truncate font-display text-base font-extrabold uppercase tracking-tight text-dark sm:text-lg">NABS Imola GP</h2><span class="hidden font-mono text-[10px] uppercase tracking-wider text-light xl:inline">Rd 11</span>
      <div class="hidden rounded-lg bg-surface2 p-0.5 sm:flex"><span class="rounded-md px-2.5 py-1 font-mono text-[11px] font-bold uppercase tracking-wider text-faint">FP</span><span class="rounded-md px-2.5 py-1 font-mono text-[11px] font-bold uppercase tracking-wider text-faint">Q</span><span class="rounded-md px-2.5 py-1 font-mono text-[11px] font-bold uppercase tracking-wider bg-card text-dark shadow-sm">R</span></div>
    </div>
    <div class="order-3 -mx-4 flex w-[calc(100%+2rem)] gap-2 overflow-x-auto px-4 sm:order-none sm:mx-0 sm:w-auto sm:flex-1 sm:overflow-hidden sm:px-0"><div class="flex shrink-0 items-center gap-1.5 rounded-lg bg-ink px-3 py-2 font-mono text-[11px] font-bold uppercase tracking-wider text-white sm:hidden"><span class="relative flex h-1.5 w-1.5 shrink-0"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-60"></span><span class="relative inline-flex h-1.5 w-1.5 rounded-full bg-emerald-400"></span></span> Race</div><div class="flex shrink-0 items-baseline gap-1.5 rounded-lg bg-surface2 px-2.5 py-2"><span class="font-mono text-[10px] font-bold uppercase tracking-wider text-light">Lap</span><span class="font-mono text-sm font-bold tabular-nums text-dark ">14/24</span></div><div class="flex shrink-0 items-baseline gap-1.5 rounded-lg bg-surface2 px-2.5 py-2"><span class="font-mono text-[10px] font-bold uppercase tracking-wider text-light">Leader</span><span class="font-mono text-sm font-bold tabular-nums text-dark ">Siggsta</span></div><div class="flex shrink-0 items-baseline gap-1.5 rounded-lg bg-surface2 px-2.5 py-2"><span class="font-mono text-[10px] font-bold uppercase tracking-wider text-light">Fastest</span><span class="font-mono text-sm font-bold tabular-nums text-dark text-fl">1:22.311</span></div><div class="flex shrink-0 items-baseline gap-1.5 rounded-lg bg-surface2 px-2.5 py-2"><span class="font-mono text-[10px] font-bold uppercase tracking-wider text-light">On track</span><span class="font-mono text-sm font-bold tabular-nums text-dark ">19/20</span></div><div class="flex shrink-0 items-baseline gap-1.5 rounded-lg bg-surface2 px-2.5 py-2"><span class="font-mono text-[10px] font-bold uppercase tracking-wider text-light">Track</span><span class="font-mono text-sm font-bold tabular-nums text-dark ">31°</span></div></div>
    <div class="ml-auto flex items-center gap-1.5">
      <button class="grid h-9 w-9 place-items-center rounded-lg border border-border text-medium" title="Live timing"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button>
      <button class="hidden h-9 w-9 place-items-center rounded-lg border border-border text-medium sm:grid" title="Join server"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg></button>
      <button class="grid h-9 w-9 place-items-center rounded-lg bg-primary text-ink" title="Patreon"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button>
    </div>
  </div>
  <div class="relative h-6 border-t border-border bg-surface2/60">
    <div class="absolute inset-y-0 left-0 bg-primary/40" style="width:58.3%"></div>
    <div class="absolute inset-y-0 border-r-2 border-accent" style="left:58.3%"><span class="absolute right-1.5 top-1/2 -translate-y-1/2 font-mono text-[10px] font-black text-accent">LAP&nbsp;14</span></div>
    <div class="absolute inset-0 flex items-center justify-between px-4 font-mono text-[10px] font-bold uppercase tracking-wider text-medium sm:px-5"><span>Lights out 19:24</span><span></span><span>Est. finish 19:58</span></div>
  </div>
</section>
<p class="mt-3 px-1 font-mono text-[10px] uppercase tracking-wider text-faint sm:hidden">← swipe the stats →</p>
</main></body></html>
