<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:"#e7ecf3", card:"#ffffff", surface2:"#f1f5f9", border:"#dbe2ec", dark:"#0f172a", medium:"#334155", light:"#586676", faint:"#68758a",
    primary:{DEFAULT:"#f4afc6", dark:"#ee8bac"}, brand:"#f4afc6", onbrand:"#0f172a", ink:"#0f172a", eyebrow:"#be185d", accent:"#db2777",
    gold:"#EAB308", silver:"#94A3B8", bronze:"#C2410C", link:"#374594", ok:"#046c4e", bad:"#b91c1c", warn:"#92400e", fl:"#701aaf", discord:"#5865F2" },
  fontFamily: { sans:["Inter","system-ui","sans-serif"], display:["Archivo","Inter","sans-serif"], mono:["JetBrains Mono","ui-monospace","monospace"] },
  boxShadow: { card:"0 1px 2px rgba(15,23,42,.06), 0 10px 26px -14px rgba(15,23,42,.28)", lift:"0 2px 6px rgba(15,23,42,.08), 0 18px 40px -16px rgba(15,23,42,.34)" }
}}}
</script>
<style>body{background:#e7ecf3;color:#0f172a;font-family:Inter,system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#be185d;font-weight:600}
#mock{padding-top:32px;padding-bottom:32px}</style>
</head><body>
<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">

<section class="relative overflow-hidden rounded-2xl bg-ink text-white shadow-lift">
  <div class="pointer-events-none absolute inset-0 opacity-[0.07]" style="background:repeating-linear-gradient(115deg,#fff 0 2px,transparent 2px 14px)"></div>
  <div class="pointer-events-none absolute -right-24 -top-24 h-72 w-72 rounded-full bg-primary/25 blur-3xl"></div>
  <div class="relative flex flex-col gap-5 px-5 pt-6 sm:px-8 sm:pt-8 lg:flex-row lg:items-start lg:justify-between">
    <div>
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-2 rounded bg-red-600 px-2 py-1 font-mono text-[10px] font-black uppercase tracking-[0.25em]"><span class="relative flex h-1.5 w-1.5 shrink-0"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-white opacity-60"></span><span class="relative inline-flex h-1.5 w-1.5 rounded-full bg-white"></span></span> On air</span>
        <span class="font-mono text-[11px] uppercase tracking-[0.2em] text-white/50">Real-time · Season 7</span>
      </div>
      <h1 class="mt-3 font-display text-5xl font-black uppercase italic leading-[0.9] tracking-tight sm:text-7xl">Live<span class="text-primary">/</span>Timing</h1>
    </div>
    <div class="flex gap-2">
      <button class="hidden items-center gap-2 rounded-lg border border-white/20 bg-white/5 px-3.5 py-2 font-mono text-[11px] font-bold uppercase tracking-wider hover:bg-white/10 sm:inline-flex"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8"/></svg> TV mode <span class="rounded bg-primary px-1.5 text-[9px] text-ink">New</span></button>
      <button class="inline-flex items-center gap-2 rounded-lg border border-white/20 bg-white/5 px-3.5 py-2 font-mono text-[11px] font-bold uppercase tracking-wider hover:bg-white/10"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg> Race control</button>
    </div>
  </div>
  <div class="relative mt-6 flex items-end justify-between gap-4 px-3 sm:px-6">
    <div class="-mb-px flex w-full gap-1.5 sm:w-auto">
        <button class="relative flex min-w-0 flex-1 items-center gap-2 rounded-t-xl px-3 pb-3 pt-2.5 text-left sm:min-w-[260px] sm:flex-none sm:gap-3 sm:px-4 bg-card text-dark">
          <span class="font-display text-xl sm:text-2xl font-black italic text-eyebrow">01</span>
          <span class="min-w-0 flex-1">
            <span class="flex items-center gap-2 font-mono text-[10px] font-bold uppercase tracking-[0.2em]"><span class="relative flex h-2 w-2 shrink-0"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-500 opacity-60"></span><span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span></span> Live</span>
            <span class="block truncate font-display text-sm font-extrabold uppercase tracking-tight">Imola · Race</span>
          </span>
          <span class="hidden font-mono text-[11px] tabular-nums sm:inline text-light">19/20</span>
        </button>
        <button class="relative flex min-w-0 flex-1 items-center gap-2 rounded-t-xl px-3 pb-3 pt-2.5 text-left sm:min-w-[260px] sm:flex-none sm:gap-3 sm:px-4 bg-white/5 text-white/70 hover:bg-white/10">
          <span class="font-display text-xl sm:text-2xl font-black italic text-white/30">02</span>
          <span class="min-w-0 flex-1">
            <span class="flex items-center gap-2 font-mono text-[10px] font-bold uppercase tracking-[0.2em]"><span class="h-2 w-2 shrink-0 rounded-full bg-amber-500"></span> Open</span>
            <span class="block truncate font-display text-sm font-extrabold uppercase tracking-tight">Istanbul · Practice</span>
          </span>
          <span class="hidden font-mono text-[11px] tabular-nums sm:inline text-white/50">3/4</span>
        </button>
    </div>
  </div>
</section>
<div class="-mt-px flex items-center gap-3 overflow-hidden rounded-b-2xl border border-t-0 border-border bg-card px-4 py-2.5 sm:px-6">
  <span class="shrink-0 font-mono text-[10px] font-black uppercase tracking-[0.2em] text-eyebrow">New</span>
  <span class="h-4 w-px shrink-0 bg-border"></span>
  <p class="min-w-0 flex-1 text-[13px] text-medium"><strong class="text-dark">Satellite track map:</strong> switch the map to Satellite and tap a car to ride along.</p>
  <button class="grid h-6 w-6 shrink-0 place-items-center rounded text-light"><svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
</div>
</main></body></html>
