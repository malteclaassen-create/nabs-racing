<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:"#e7ecf3", card:"#ffffff", surface2:"#f1f5f9", border:"#dbe2ec", dark:"#0f172a", medium:"#334155", light:"#586676", faint:"#68758a",
    primary:{DEFAULT:"#f4afc6", dark:"#ee8bac"}, brand:"#f4afc6", onbrand:"#0f172a", ink:"#0f172a", eyebrow:"#be185d", accent:"#db2777",
    gold:"#EAB308", silver:"#94A3B8", bronze:"#C2410C", link:"#374594", ok:"#046c4e", bad:"#b91c1c", warn:"#92400e", fl:"#701aaf", discord:"#5865F2" },
  fontFamily: { sans:["Inter","system-ui","sans-serif"], display:["Archivo","Inter","sans-serif"], mono:["JetBrains Mono","ui-monospace","monospace"] },
  boxShadow: { card:"0 1px 2px rgba(15,23,42,.06), 0 10px 26px -14px rgba(15,23,42,.28)", lift:"0 2px 6px rgba(15,23,42,.08), 0 18px 40px -16px rgba(15,23,42,.34)" }
}}}
</script>
<style>body{background:#e7ecf3;color:#0f172a;font-family:Inter,system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#be185d;font-weight:600}
#mock{padding-top:32px;padding-bottom:32px}</style>
</head><body>
<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">

<div>
  <div class="relative flex items-center gap-2 rounded-2xl bg-card p-2 shadow-card sm:gap-3 sm:p-2.5">
    <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-primary text-ink"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg></span>
    <div class="min-w-0 sm:mr-2">
      <div class="font-mono text-[9px] font-bold uppercase tracking-[0.22em] text-eyebrow">Real-time</div>
      <h1 class="font-display text-lg font-black uppercase leading-none tracking-tight text-dark sm:text-xl">Live Timing</h1>
    </div>
    <span class="hidden h-8 w-px bg-border sm:block"></span>
    <button class="ml-auto flex min-w-0 items-center gap-2 rounded-xl border border-dark bg-card px-3 py-2 ring-4 ring-primary/30 sm:ml-0">
      <span class="relative flex h-2 w-2 shrink-0"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-500 opacity-60"></span><span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span></span>
      <span class="truncate text-sm font-bold text-dark">Server 1</span>
      <span class="hidden truncate text-sm text-light md:inline">· Imola · Race</span>
      <svg viewBox="0 0 24 24" class="h-4 w-4 text-light rotate-180" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="ml-auto hidden items-center gap-1.5 sm:flex">
      <span class="hidden items-center gap-1.5 rounded-lg bg-surface2 px-2.5 py-1.5 font-mono text-[11px] font-bold uppercase tracking-wider text-medium lg:inline-flex"><svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> 19/20</span>
      <span class="hidden items-center gap-1.5 rounded-lg bg-surface2 px-2.5 py-1.5 font-mono text-[11px] font-bold uppercase tracking-wider text-medium lg:inline-flex"><svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/></svg> 38 ms</span>
      <button class="relative grid h-9 w-9 place-items-center rounded-lg border border-border text-medium" title="What's new"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 7 9 3 5 7l4 4"/><path d="m17 11 4 4-4 4-4-4"/><path d="m8 12 4 4 6-6-4-4Z"/><path d="m16 8 3-3"/><path d="M9 21a6 6 0 0 0-6-6"/></svg><span class="absolute -right-1 -top-1 h-2.5 w-2.5 rounded-full bg-accent ring-2 ring-white"></span></button>
      <button class="grid h-9 w-9 place-items-center rounded-lg border border-border text-medium" title="TV mode"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8"/></svg></button>
      <button class="grid h-9 w-9 place-items-center rounded-lg border border-border text-medium" title="Race control"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></button>
    </div>
  <!-- picker: popover on desktop, bottom sheet on mobile -->
  <div class="absolute left-0 right-0 top-full z-10 mt-3 rounded-2xl bg-ink/35 px-0 pt-16 sm:left-[200px] sm:right-auto sm:mt-2 sm:w-[400px] sm:bg-transparent sm:pt-0">
    <div class="rounded-t-3xl bg-card p-2 shadow-lift sm:rounded-2xl sm:border sm:border-border">
      <div class="mx-auto mb-2 mt-1 h-1 w-10 rounded-full bg-border sm:hidden"></div>
      <div class="flex items-center justify-between px-3 pb-1 pt-1"><span class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-light">Choose race server</span><span class="font-mono text-[10px] text-faint">updated 4 s ago</span></div>
      
        <button class="flex w-full items-start gap-3 rounded-xl px-3 py-3 text-left bg-primary/15">
          <span class="mt-1.5 flex"><span class="relative flex h-2 w-2 shrink-0"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-500 opacity-60"></span><span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span></span></span>
          <span class="min-w-0 flex-1">
            <span class="flex items-center justify-between gap-2"><span class="text-sm font-bold text-dark">Server 1</span><span class="font-mono text-[10px] text-faint">38 ms</span></span>
            <span class="block truncate text-xs text-light">NABS Race Server #1</span>
            <span class="mt-1.5 flex flex-wrap gap-1.5">
              <span class="rounded bg-surface2 px-1.5 py-0.5 font-mono text-[10px] font-bold uppercase tracking-wider text-medium">Imola</span>
              <span class="rounded bg-surface2 px-1.5 py-0.5 font-mono text-[10px] font-bold uppercase tracking-wider text-medium">Race · Lap 14/24</span>
              <span class="rounded bg-emerald-500/15 text-ok px-1.5 py-0.5 font-mono text-[10px] font-bold uppercase tracking-wider">19 on track</span>
            </span>
          </span>
          <svg viewBox="0 0 24 24" class="mt-1 h-4 w-4 text-eyebrow" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
        <button class="flex w-full items-start gap-3 rounded-xl px-3 py-3 text-left hover:bg-surface2">
          <span class="mt-1.5 flex"><span class="h-2 w-2 shrink-0 rounded-full bg-amber-500"></span></span>
          <span class="min-w-0 flex-1">
            <span class="flex items-center justify-between gap-2"><span class="text-sm font-bold text-dark">Server 2</span><span class="font-mono text-[10px] text-faint">41 ms</span></span>
            <span class="block truncate text-xs text-light">NABS Practice Server</span>
            <span class="mt-1.5 flex flex-wrap gap-1.5">
              <span class="rounded bg-surface2 px-1.5 py-0.5 font-mono text-[10px] font-bold uppercase tracking-wider text-medium">Istanbul</span>
              <span class="rounded bg-surface2 px-1.5 py-0.5 font-mono text-[10px] font-bold uppercase tracking-wider text-medium">Practice · 6d 10:56 left</span>
              <span class="rounded bg-amber-500/15 text-warn px-1.5 py-0.5 font-mono text-[10px] font-bold uppercase tracking-wider">3 on track</span>
            </span>
          </span>
          <span class="w-4"></span>
        </button>
      <div class="mt-1 border-t border-border px-3 pb-1 pt-2.5 text-xs text-light"><span class="font-semibold text-dark">Tip:</span> cars are out on Server 2 too — the dot turns green when a race starts.</div>
    </div>
  </div>
  </div>
  <div class="h-[400px] sm:h-[300px]"></div>
  <div class="mt-3 flex items-center gap-2 rounded-xl bg-ink px-3 py-2.5 text-white sm:hidden">
    <span class="relative"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 7 9 3 5 7l4 4"/><path d="m17 11 4 4-4 4-4-4"/><path d="m8 12 4 4 6-6-4-4Z"/><path d="m16 8 3-3"/><path d="M9 21a6 6 0 0 0-6-6"/></svg><span class="absolute -right-1 -top-1 h-2 w-2 rounded-full bg-primary"></span></span>
    <span class="text-[13px]"><strong>New:</strong> satellite track map</span>
    <span class="ml-auto font-mono text-[10px] font-bold uppercase tracking-wider text-primary">Try</span>
  </div>
</div>
</main></body></html>
