<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:"#e7ecf3", card:"#ffffff", surface2:"#f1f5f9", border:"#dbe2ec", dark:"#0f172a", medium:"#334155", light:"#586676", faint:"#68758a",
    primary:{DEFAULT:"#f4afc6", dark:"#ee8bac"}, brand:"#f4afc6", onbrand:"#0f172a", ink:"#0f172a", eyebrow:"#be185d", accent:"#db2777",
    gold:"#EAB308", silver:"#94A3B8", bronze:"#C2410C", link:"#374594", ok:"#046c4e", bad:"#b91c1c", warn:"#92400e", fl:"#701aaf", discord:"#5865F2" },
  fontFamily: { sans:["Inter","system-ui","sans-serif"], display:["Archivo","Inter","sans-serif"], mono:["JetBrains Mono","ui-monospace","monospace"] },
  boxShadow: { card:"0 1px 2px rgba(15,23,42,.06), 0 10px 26px -14px rgba(15,23,42,.28)", lift:"0 2px 6px rgba(15,23,42,.08), 0 18px 40px -16px rgba(15,23,42,.34)" }
}}}
</script>
<style>body{background:#e7ecf3;color:#0f172a;font-family:Inter,system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#be185d;font-weight:600}
#mock{padding-top:32px;padding-bottom:32px}</style>
<style>*::-webkit-scrollbar{display:none}</style></head><body>
<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">

<section class="relative overflow-hidden rounded-2xl bg-ink text-white shadow-lift">
  <img src="/heroes/s7.jpg" class="absolute inset-0 h-full w-full object-cover opacity-35" alt="">
  <div class="absolute inset-0 bg-gradient-to-r from-ink via-ink/90 to-ink/40"></div>
  <div class="absolute inset-x-0 top-0 h-1 bg-primary"></div>
  <div class="relative grid gap-6 p-5 sm:p-8 lg:grid-cols-[1fr_380px] lg:items-end">
    <div class="min-w-0">
      <div class="flex items-center gap-2 font-mono text-[11px] font-bold uppercase tracking-[.2em] text-primary"><span class="h-2 w-2 animate-pulse rounded-full bg-primary"></span>Season 7 · Live table</div>
      <h1 class="mt-3 font-display text-[34px] font-black uppercase leading-[.9] tracking-tight sm:text-7xl">Constructors'<br><span class="text-primary">Championship</span></h1>
      <div class="mt-5 flex flex-wrap items-center gap-x-5 gap-y-2 font-mono text-[11px] uppercase tracking-wider text-white/60">
        <span>Round <b class="text-white">10</b>/12 done</span><span class="hidden sm:inline">·</span><span class="flex items-center gap-1.5">Next <img src="/flags/w40/us.png" alt="" class="inline-block shrink-0 rounded-[2px] ring-1 ring-black/10 " style="width:16px;height:11px;object-fit:cover"> <b class="text-white">COTA</b> in 6 days</span>
      </div>
      <div class="mt-6"><div class="inline-flex rounded-xl bg-white/10 p-1 ring-1 ring-white/15">
<button class="rounded-lg px-4 py-2 font-mono text-[11px] font-bold uppercase tracking-wider bg-primary text-ink">Tier 1</button>
<button class="rounded-lg px-4 py-2 font-mono text-[11px] font-bold uppercase tracking-wider text-white/70">Tier 2</button></div></div>
    </div>
    <div class="grid min-w-0 gap-2.5">
      <div class="flex items-center gap-3 rounded-xl bg-white/[.06] px-4 py-3 ring-1 ring-white/10 backdrop-blur">
  <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-white"><img src="/teams/porsche.png" alt="" class="shrink-0 object-contain " style="width:28px;height:28px"></span>
  <div class="min-w-0 flex-1"><div class="font-mono text-[10px] font-bold uppercase tracking-widest text-white/50">Tier 1 leader</div>
  <div class="truncate font-display text-base font-extrabold uppercase text-white">Porsche Martini</div></div>
  <div class="text-right"><div class="font-display text-2xl font-black tabular-nums text-white">409</div><div class="font-mono text-[10px] font-bold text-emerald-400">+10 to P2</div></div></div>
      <div class="flex items-center gap-3 rounded-xl bg-white/[.06] px-4 py-3 ring-1 ring-white/10 backdrop-blur">
  <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-white"><img src="/teams/lotus.png" alt="" class="shrink-0 object-contain " style="width:28px;height:28px"></span>
  <div class="min-w-0 flex-1"><div class="font-mono text-[10px] font-bold uppercase tracking-widest text-white/50">Tier 2 leader</div>
  <div class="truncate font-display text-base font-extrabold uppercase text-white">Lotus</div></div>
  <div class="text-right"><div class="font-display text-2xl font-black tabular-nums text-white">294</div><div class="font-mono text-[10px] font-bold text-emerald-400">+46 to P2</div></div></div>
    </div>
  </div>
</section>
</main></body></html>
