<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:"#e7ecf3", card:"#ffffff", surface2:"#f1f5f9", border:"#dbe2ec", dark:"#0f172a", medium:"#334155", light:"#586676", faint:"#68758a",
    primary:{DEFAULT:"#f4afc6", dark:"#ee8bac"}, brand:"#f4afc6", onbrand:"#0f172a", ink:"#0f172a", eyebrow:"#be185d", accent:"#db2777",
    gold:"#EAB308", silver:"#94A3B8", bronze:"#C2410C", link:"#374594", ok:"#046c4e", bad:"#b91c1c", warn:"#92400e", fl:"#701aaf", discord:"#5865F2" },
  fontFamily: { sans:["Inter","system-ui","sans-serif"], display:["Archivo","Inter","sans-serif"], mono:["JetBrains Mono","ui-monospace","monospace"] },
  boxShadow: { card:"0 1px 2px rgba(15,23,42,.06), 0 10px 26px -14px rgba(15,23,42,.28)", lift:"0 2px 6px rgba(15,23,42,.08), 0 18px 40px -16px rgba(15,23,42,.34)" }
}}}
</script>
<style>body{background:#e7ecf3;color:#0f172a;font-family:Inter,system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#be185d;font-weight:600}
#mock{padding-top:32px;padding-bottom:32px}</style>
</head><body>
<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">
<section class="overflow-hidden rounded-2xl bg-ink text-white shadow-lift">
  <div class="flex items-center justify-between border-b border-white/10 px-5 py-3 sm:px-7">
    <div class="flex items-center gap-2 font-mono text-[10px] font-bold uppercase tracking-[0.22em] text-primary"><span class="h-1.5 w-1.5 rounded-full bg-primary animate-pulse"></span>League telemetry</div>
    <div class="font-mono text-[10px] uppercase tracking-[0.2em] text-white/40">Updated after R10</div>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-4">
    <div class="relative px-5 py-6 sm:px-7 sm:py-8 border-b sm:border-b-0 border-r border-dashed border-white/15"><div class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-white/45">01 · Years</div><div class="mt-3 font-mono text-5xl sm:text-6xl font-bold leading-none tabular-nums">06</div><div class="mt-3 h-1 w-full rounded bg-white/10"><div class="h-1 w-[85%] rounded bg-primary"></div></div></div>
    <div class="relative px-5 py-6 sm:px-7 sm:py-8 border-b sm:border-b-0 sm:border-r border-dashed border-white/15"><div class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-white/45">02 · Discord</div><div class="mt-3 font-mono text-5xl sm:text-6xl font-bold leading-none tabular-nums">900<span class="text-primary">+</span></div><div class="mt-3 font-mono text-[10px] uppercase tracking-wider text-ok brightness-[2.2]">▲ 34 this month</div></div>
    <div class="relative px-5 py-6 sm:px-7 sm:py-8 border-r border-dashed border-white/15"><div class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-white/45">03 · Teams</div><div class="mt-3 font-mono text-5xl sm:text-6xl font-bold leading-none tabular-nums">17</div><div class="mt-3 font-mono text-[10px] uppercase tracking-wider text-white/50">T1 · 9 &nbsp; T2 · 8</div></div>
    <div class="relative px-5 py-6 sm:px-7 sm:py-8"><div class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-white/45">04 · Seasons</div><div class="mt-3 font-mono text-5xl sm:text-6xl font-bold leading-none tabular-nums text-primary">07</div><div class="mt-3 flex gap-1"><span class="h-1 flex-1 rounded bg-white/40"></span><span class="h-1 flex-1 rounded bg-white/40"></span><span class="h-1 flex-1 rounded bg-white/40"></span><span class="h-1 flex-1 rounded bg-white/40"></span><span class="h-1 flex-1 rounded bg-white/40"></span><span class="h-1 flex-1 rounded bg-white/40"></span><span class="h-1 flex-1 rounded bg-primary"></span></div></div>
  </div>
</section>
</main></body></html>
