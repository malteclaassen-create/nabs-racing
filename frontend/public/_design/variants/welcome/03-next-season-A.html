<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:"#e7ecf3", card:"#ffffff", surface2:"#f1f5f9", border:"#dbe2ec", dark:"#0f172a", medium:"#334155", light:"#586676", faint:"#68758a",
    primary:{DEFAULT:"#f4afc6", dark:"#ee8bac"}, brand:"#f4afc6", onbrand:"#0f172a", ink:"#0f172a", eyebrow:"#be185d", accent:"#db2777",
    gold:"#EAB308", silver:"#94A3B8", bronze:"#C2410C", link:"#374594", ok:"#046c4e", bad:"#b91c1c", warn:"#92400e", fl:"#701aaf", discord:"#5865F2" },
  fontFamily: { sans:["Inter","system-ui","sans-serif"], display:["Archivo","Inter","sans-serif"], mono:["JetBrains Mono","ui-monospace","monospace"] },
  boxShadow: { card:"0 1px 2px rgba(15,23,42,.06), 0 10px 26px -14px rgba(15,23,42,.28)", lift:"0 2px 6px rgba(15,23,42,.08), 0 18px 40px -16px rgba(15,23,42,.34)" }
}}}
</script>
<style>body{background:#e7ecf3;color:#0f172a;font-family:Inter,system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#be185d;font-weight:600}
#mock{padding-top:32px;padding-bottom:32px}</style>
</head><body>
<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">
<section class="overflow-hidden rounded-2xl bg-card shadow-card">
  <div class="grid grid-cols-1 lg:grid-cols-[1fr_460px]">
    <div class="order-2 lg:order-1 p-6 sm:p-9">
      <div class="flex items-center gap-2 font-mono text-[11px] font-bold uppercase tracking-[0.2em] text-eyebrow"><span class="h-2 w-2 rounded-full bg-accent"></span>Coming up</div>
      <h2 class="mt-2 font-display text-3xl sm:text-4xl font-black uppercase tracking-tight">Season 8</h2>
      <p class="mt-2 max-w-lg text-[15px] leading-relaxed text-medium">The new season kicks off at <b class="text-ink">Melbourne</b>. Grids are forming now, so jump into the Discord to claim a seat before the opener.</p>
      <div class="mt-5 flex flex-wrap gap-2">
        <span class="rounded-lg bg-surface2 px-3 py-1.5 font-mono text-[11px] font-bold uppercase tracking-wider text-medium">F1 2010 · Assetto Corsa</span>
        <span class="rounded-lg bg-surface2 px-3 py-1.5 font-mono text-[11px] font-bold uppercase tracking-wider text-medium">12 rounds</span>
        <span class="rounded-lg bg-surface2 px-3 py-1.5 font-mono text-[11px] font-bold uppercase tracking-wider text-medium">Opener · Fri 21 Aug</span>
      </div>
      <div class="mt-6 flex flex-col sm:flex-row sm:items-center gap-4">
        <a class="inline-flex items-center justify-center gap-2.5 rounded-xl bg-discord px-6 py-3.5 text-sm font-bold uppercase tracking-wide text-white shadow-lg shadow-discord/30"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.25.5a18.3 18.3 0 0 1 4.3 1.4 16.2 16.2 0 0 0-13 0A18.3 18.3 0 0 1 10.8 3.5L10.5 3A19.8 19.8 0 0 0 5.6 4.4 20.7 20.7 0 0 0 2 18.6 19.9 19.9 0 0 0 8 21l.5-1.7c-1-.3-1.9-.7-2.7-1.2l.6-.45a14.2 14.2 0 0 0 12.1 0l.6.45c-.85.5-1.75.9-2.7 1.2L17 21a19.9 19.9 0 0 0 6-2.4 20.7 20.7 0 0 0-2.7-14.2zM9 15.3c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg> Join for Season 8 →</a>
        <span class="text-center sm:text-left text-sm text-light">or <a class="font-semibold text-link underline underline-offset-4 decoration-link/30">see the calendar</a></span>
      </div>
    </div>
    <div class="order-1 lg:order-2 relative h-72 lg:h-auto bg-[#05070c]">
      <img src="/cars/s8.jpg" class="absolute inset-x-0 top-0 h-[78%] lg:h-full w-full object-contain lg:object-cover lg:object-[center_60%] mix-blend-screen">
      <div class="absolute inset-x-4 bottom-4 grid grid-cols-4 gap-1.5 rounded-xl bg-white/10 p-2 backdrop-blur-md ring-1 ring-white/15">
        <div class="text-center"><div class="font-mono text-xl font-black text-white">49</div><div class="font-mono text-[9px] font-bold tracking-[0.18em] text-white/55">DAYS</div></div>
        <div class="text-center"><div class="font-mono text-xl font-black text-white">06</div><div class="font-mono text-[9px] font-bold tracking-[0.18em] text-white/55">HRS</div></div>
        <div class="text-center"><div class="font-mono text-xl font-black text-white">41</div><div class="font-mono text-[9px] font-bold tracking-[0.18em] text-white/55">MIN</div></div>
        <div class="text-center"><div class="font-mono text-xl font-black text-primary">17</div><div class="font-mono text-[9px] font-bold tracking-[0.18em] text-white/55">SEC</div></div>
      </div>
    </div>
  </div>
</section>
