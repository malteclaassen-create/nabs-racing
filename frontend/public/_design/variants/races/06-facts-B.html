<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:"#e7ecf3", card:"#ffffff", surface2:"#f1f5f9", border:"#dbe2ec", dark:"#0f172a", medium:"#334155", light:"#586676", faint:"#68758a",
    primary:{DEFAULT:"#f4afc6", dark:"#ee8bac"}, brand:"#f4afc6", onbrand:"#0f172a", ink:"#0f172a", eyebrow:"#be185d", accent:"#db2777",
    gold:"#EAB308", silver:"#94A3B8", bronze:"#C2410C", link:"#374594", ok:"#046c4e", bad:"#b91c1c", warn:"#92400e", fl:"#701aaf", discord:"#5865F2" },
  fontFamily: { sans:["Inter","system-ui","sans-serif"], display:["Archivo","Inter","sans-serif"], mono:["JetBrains Mono","ui-monospace","monospace"] },
  boxShadow: { card:"0 1px 2px rgba(15,23,42,.06), 0 10px 26px -14px rgba(15,23,42,.28)", lift:"0 2px 6px rgba(15,23,42,.08), 0 18px 40px -16px rgba(15,23,42,.34)" }
}}}
</script>
<style>body{background:#e7ecf3;color:#0f172a;font-family:Inter,system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#be185d;font-weight:600}
#mock{padding-top:32px;padding-bottom:32px}</style>

<style>
.ghost-num{font-family:Archivo,Inter,sans-serif;font-weight:900}
.tnum{font-variant-numeric:tabular-nums}
.no-sb::-webkit-scrollbar{display:none} .no-sb{scrollbar-width:none}
</style></head><body class="">
<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">
<div class="rounded-3xl bg-gradient-to-br from-slate-200 to-bg p-4 sm:p-6"><div class="mb-3 flex items-center gap-2 font-mono text-[11px] font-bold uppercase tracking-[0.2em] text-medium"><span class="h-2 w-2 animate-pulse rounded-full bg-accent"></span>Race facts</div>
<div class="-mx-4 flex snap-x gap-3 overflow-x-auto no-sb px-4 sm:mx-0 sm:grid sm:grid-cols-3 sm:px-0"><div class="relative flex min-w-[300px] snap-start items-stretch overflow-hidden rounded-lg bg-ink text-white shadow-lift sm:min-w-0">
<span class="flex w-14 shrink-0 items-center justify-center bg-fl"><svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13V9M9 2h6M19 6l-1.5 1.5"/><circle cx="12" cy="13" r="8"/></svg></span>
<div class="min-w-0 flex-1 px-4 py-3"><div class="font-mono text-[10px] font-bold uppercase tracking-[0.22em] text-fuchsia-300">Fastest lap</div>
<div class="mt-0.5 flex items-center gap-2 font-display text-xl font-black uppercase tracking-tight">13bot<img src="/flags/w40/gb.png" alt="" style="width:18px;height:13px" class="inline-block shrink-0 rounded-[2px] object-cover shadow-[0_0_0_1px_rgba(15,23,42,.08)] "></div>
<div class="truncate font-mono text-[11px] text-white/50">lap 18 · started P5</div></div>
<div class="flex shrink-0 items-center pr-4 font-mono text-xl font-bold tnum sm:text-2xl">1:27.905</div>
<span class="absolute inset-x-0 bottom-0 h-0.5" style="background:#1AA39B"></span></div><div class="relative flex min-w-[300px] snap-start items-stretch overflow-hidden rounded-lg bg-ink text-white shadow-lift sm:min-w-0">
<span class="flex w-14 shrink-0 items-center justify-center bg-primary text-ink"><svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span>
<div class="min-w-0 flex-1 px-4 py-3"><div class="font-mono text-[10px] font-bold uppercase tracking-[0.22em] text-primary">Biggest climber</div>
<div class="mt-0.5 flex items-center gap-2 font-display text-xl font-black uppercase tracking-tight">Neesh<img src="/flags/w40/ca.png" alt="" style="width:18px;height:13px" class="inline-block shrink-0 rounded-[2px] object-cover shadow-[0_0_0_1px_rgba(15,23,42,.08)] "></div>
<div class="truncate font-mono text-[11px] text-white/50">P25 → P12</div></div>
<div class="flex shrink-0 items-center pr-4 font-mono text-xl font-bold tnum sm:text-2xl">+13</div>
<span class="absolute inset-x-0 bottom-0 h-0.5" style="background:#E6A700"></span></div><div class="relative flex min-w-[300px] snap-start items-stretch overflow-hidden rounded-lg bg-ink text-white shadow-lift sm:min-w-0">
<span class="flex w-14 shrink-0 items-center justify-center bg-primary text-ink"><svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-1.6 3.5L16 11H5"/></svg></span>
<div class="min-w-0 flex-1 px-4 py-3"><div class="font-mono text-[10px] font-bold uppercase tracking-[0.22em] text-primary">Pole position</div>
<div class="mt-0.5 flex items-center gap-2 font-display text-xl font-black uppercase tracking-tight">Mtimmis<img src="/flags/w40/gb.png" alt="" style="width:18px;height:13px" class="inline-block shrink-0 rounded-[2px] object-cover shadow-[0_0_0_1px_rgba(15,23,42,.08)] "></div>
<div class="truncate font-mono text-[11px] text-white/50">started first, finished 2nd</div></div>
<div class="flex shrink-0 items-center pr-4 font-mono text-xl font-bold tnum sm:text-2xl">P1</div>
<span class="absolute inset-x-0 bottom-0 h-0.5" style="background:#1AA39B"></span></div></div></div>
</main></body></html>
