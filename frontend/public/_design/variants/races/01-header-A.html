<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:"#e7ecf3", card:"#ffffff", surface2:"#f1f5f9", border:"#dbe2ec", dark:"#0f172a", medium:"#334155", light:"#586676", faint:"#68758a",
    primary:{DEFAULT:"#f4afc6", dark:"#ee8bac"}, brand:"#f4afc6", onbrand:"#0f172a", ink:"#0f172a", eyebrow:"#be185d", accent:"#db2777",
    gold:"#EAB308", silver:"#94A3B8", bronze:"#C2410C", link:"#374594", ok:"#046c4e", bad:"#b91c1c", warn:"#92400e", fl:"#701aaf", discord:"#5865F2" },
  fontFamily: { sans:["Inter","system-ui","sans-serif"], display:["Archivo","Inter","sans-serif"], mono:["JetBrains Mono","ui-monospace","monospace"] },
  boxShadow: { card:"0 1px 2px rgba(15,23,42,.06), 0 10px 26px -14px rgba(15,23,42,.28)", lift:"0 2px 6px rgba(15,23,42,.08), 0 18px 40px -16px rgba(15,23,42,.34)" }
}}}
</script>
<style>body{background:#e7ecf3;color:#0f172a;font-family:Inter,system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#be185d;font-weight:600}
#mock{padding-top:32px;padding-bottom:32px}</style>

<style>
.ghost-num{font-family:Archivo,Inter,sans-serif;font-weight:900}
.tnum{font-variant-numeric:tabular-nums}
.no-sb::-webkit-scrollbar{display:none} .no-sb{scrollbar-width:none}
</style></head><body class="">
<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">

<div class="pb-0">
  <div class="flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
    <div>
      <p class="eyebrow">Schedule &amp; Results</p>
      <h1 class="mt-1 font-display text-[34px] font-black uppercase leading-none tracking-tight text-dark sm:text-5xl">Season 7 Races</h1>
      <p class="mt-3 max-w-xl text-[15px] leading-relaxed text-light">Twelve championship rounds and three special events. Pick a round to see the full classification, or sign up for what's next.</p>
    </div>
    <div class="w-full rounded-2xl bg-card p-4 shadow-card lg:w-[420px]">
      <div class="flex items-center justify-between font-mono text-[11px] font-bold uppercase tracking-wider text-light">
        <span>Season progress</span><span class="text-dark tnum">10/12 rounds</span>
      </div>
      <div class="mt-2.5 flex gap-1"><span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span><span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span><span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span><span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span><span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span><span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span><span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span><span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span><span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span><span class="h-1.5 flex-1 rounded-full bg-emerald-500"></span><span class="h-1.5 flex-1 rounded-full bg-primary"></span><span class="h-1.5 flex-1 rounded-full bg-border"></span></div>
      <div class="mt-3 flex items-center justify-between gap-3 text-sm">
        <span class="flex min-w-0 items-center gap-2"><img src="/flags/w40/us.png" alt="" style="width:20px;height:14px" class="inline-block shrink-0 rounded-[2px] object-cover shadow-[0_0_0_1px_rgba(15,23,42,.08)] "><span class="truncate font-semibold text-dark">Next: R11 COTA</span></span>
        <span class="shrink-0 font-mono text-xs font-bold text-eyebrow">in 6 days · Fri 20:00</span>
      </div>
    </div>
  </div>
  <div class="mt-7 border-b border-border">
    <nav class="-mb-px flex gap-6 overflow-x-auto no-sb sm:gap-8">
      <a class="flex shrink-0 items-center gap-2 border-b-[3px] border-accent pb-3 font-display text-[15px] font-extrabold uppercase tracking-tight text-dark">Championship <span class="rounded-full bg-primary px-2 py-0.5 font-mono text-[11px] text-dark">12</span></a>
      <a class="flex shrink-0 items-center gap-2 border-b-[3px] border-transparent pb-3 font-display text-[15px] font-extrabold uppercase tracking-tight text-light">Special Events <span class="rounded-full bg-surface2 px-2 py-0.5 font-mono text-[11px] text-light">3</span></a>
      <a class="flex shrink-0 items-center gap-2 border-b-[3px] border-transparent pb-3 font-display text-[15px] font-extrabold uppercase tracking-tight text-light">Training <span class="rounded-full bg-surface2 px-2 py-0.5 font-mono text-[11px] text-light">2</span></a>
    </nav>
  </div>
</div>
</main></body></html>
