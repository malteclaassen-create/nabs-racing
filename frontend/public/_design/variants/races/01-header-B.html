<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:"#e7ecf3", card:"#ffffff", surface2:"#f1f5f9", border:"#dbe2ec", dark:"#0f172a", medium:"#334155", light:"#586676", faint:"#68758a",
    primary:{DEFAULT:"#f4afc6", dark:"#ee8bac"}, brand:"#f4afc6", onbrand:"#0f172a", ink:"#0f172a", eyebrow:"#be185d", accent:"#db2777",
    gold:"#EAB308", silver:"#94A3B8", bronze:"#C2410C", link:"#374594", ok:"#046c4e", bad:"#b91c1c", warn:"#92400e", fl:"#701aaf", discord:"#5865F2" },
  fontFamily: { sans:["Inter","system-ui","sans-serif"], display:["Archivo","Inter","sans-serif"], mono:["JetBrains Mono","ui-monospace","monospace"] },
  boxShadow: { card:"0 1px 2px rgba(15,23,42,.06), 0 10px 26px -14px rgba(15,23,42,.28)", lift:"0 2px 6px rgba(15,23,42,.08), 0 18px 40px -16px rgba(15,23,42,.34)" }
}}}
</script>
<style>body{background:#e7ecf3;color:#0f172a;font-family:Inter,system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#be185d;font-weight:600}
#mock{padding-top:32px;padding-bottom:32px}</style>

<style>
.ghost-num{font-family:Archivo,Inter,sans-serif;font-weight:900}
.tnum{font-variant-numeric:tabular-nums}
.no-sb::-webkit-scrollbar{display:none} .no-sb{scrollbar-width:none}
</style></head><body class="">
<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">

<section class="relative overflow-hidden rounded-3xl bg-ink text-white shadow-lift">
  <img src="/heroes/s7.jpg" class="absolute inset-0 h-full w-full object-cover object-[70%_60%] opacity-60" alt="">
  <div class="absolute inset-0 bg-gradient-to-r from-ink via-ink/85 to-ink/20"></div>
  <div class="absolute inset-x-0 bottom-0 h-1 bg-gradient-to-r from-primary via-accent to-transparent"></div>
  <div class="relative px-5 pb-5 pt-7 sm:px-10 sm:pb-8 sm:pt-12">
    <div class="flex items-center gap-2 font-mono text-[11px] font-bold uppercase tracking-[0.22em] text-primary"><span class="h-2 w-2 rounded-full bg-primary"></span> F1 2007 · Assetto Corsa</div>
    <h1 class="mt-3 font-display text-[44px] font-black uppercase leading-[0.9] tracking-tight sm:text-[84px]">Season 7<br><span class="text-white/40">Races</span></h1>
    <div class="mt-6 grid grid-cols-3 gap-2 sm:flex sm:gap-3">
      <div class="rounded-xl border border-white/10 bg-white/5 px-3 py-2.5 backdrop-blur sm:px-4"><div class="font-display text-xl font-black tnum sm:text-2xl">10<span class="text-white/40">/12</span></div><div class="font-mono text-[10px] uppercase tracking-wider text-white/60">Rounds run</div></div>
      <div class="rounded-xl border border-white/10 bg-white/5 px-3 py-2.5 backdrop-blur sm:px-4"><div class="font-display text-xl font-black tnum sm:text-2xl">7</div><div class="font-mono text-[10px] uppercase tracking-wider text-white/60">Winners</div></div>
      <div class="rounded-xl border border-primary/40 bg-primary/15 px-3 py-2.5 backdrop-blur sm:px-4"><div class="whitespace-nowrap font-display text-xl font-black tnum text-primary sm:text-2xl">6d 04h</div><div class="font-mono text-[10px] uppercase tracking-wider text-white/60">to COTA</div></div>
    </div>
    <div class="mt-6 flex gap-2 overflow-x-auto no-sb sm:mt-8">
      <a class="shrink-0 rounded-full bg-primary px-4 py-2 text-sm font-bold text-ink">Championship · 12</a>
      <a class="shrink-0 rounded-full border border-white/20 px-4 py-2 text-sm font-semibold text-white/80">Special Events · 3</a>
      <a class="shrink-0 rounded-full border border-white/20 px-4 py-2 text-sm font-semibold text-white/80">Training · 2</a>
    </div>
  </div>
</section>
</main></body></html>
