/* Line chart. series:[{n,col,vals}], vals = cumulative per round incl R0. */
function lineChart(el,series,o={}){
  const W=el.clientWidth||600,H=o.h||300,dark=!!o.dark,rounds=o.rounds||12;
  const pl=o.pl??36,pr=o.pr??(o.endLabels?120:14),pt=14,pb=26;
  const max=o.max||Math.ceil(Math.max(...series.flatMap(s=>s.vals))/100)*100;
  const x=i=>pl+(W-pl-pr)*i/rounds,y=v=>pt+(H-pt-pb)*(1-v/max);
  const g=dark?'rgba(255,255,255,.08)':'#e5eaf1',tx=dark?'rgba(255,255,255,.45)':'#68758a';
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;font-family:JetBrains Mono,monospace">`;
  const done=series[0].vals.length-1;
  if(o.future!==false) s+=`<rect x="${x(done)}" y="${pt}" width="${x(rounds)-x(done)}" height="${H-pt-pb}" fill="${dark?'rgba(255,255,255,.03)':'#f4f6fa'}"/><text x="${(x(done)+x(rounds))/2}" y="${pt+14}" text-anchor="middle" font-size="9" fill="${tx}" letter-spacing="1.5">TO GO</text>`;
  const step=o.step||(max>300?100:50);
  for(let v=0;v<=max;v+=step){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${g}"/><text x="${pl-8}" y="${y(v)+3}" text-anchor="end" font-size="10" fill="${tx}">${v}</text>`;}
  for(let i=1;i<=rounds;i++) s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="${tx}">R${i}</text>`;
  const hl=o.highlight;
  series.forEach(se=>{const fade=hl&&!hl.includes(se.n);
    if(o.area&&!fade){s+=`<path d="M${x(0)},${y(0)} ${se.vals.map((v,i)=>`L${x(i)},${y(v)}`).join(' ')} L${x(se.vals.length-1)},${y(0)}Z" fill="${se.col}" opacity="${dark?.18:.10}"/>`;}
    s+=`<polyline points="${se.vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${fade?(dark?'rgba(255,255,255,.18)':'#cbd5e1'):se.col}" stroke-width="${fade?1.5:(o.sw||2.5)}" stroke-linejoin="round" stroke-linecap="round"/>`;});
  if(o.endLabels){const pts=series.map(se=>({se,yy:y(se.vals[se.vals.length-1])})).sort((a,b)=>a.yy-b.yy);
    for(let i=1;i<pts.length;i++) if(pts[i].yy-pts[i-1].yy<13) pts[i].yy=pts[i-1].yy+13;
    pts.forEach(p=>{const se=p.se,fade=hl&&!hl.includes(se.n),lx=x(se.vals.length-1),ly=y(se.vals[se.vals.length-1]);
      s+=`<circle cx="${lx}" cy="${ly}" r="3.5" fill="${fade?'#cbd5e1':se.col}" stroke="${dark?'#0f172a':'#fff'}" stroke-width="1.5"/>`;
      s+=`<text x="${x(rounds)+8}" y="${p.yy+3.5}" font-size="10.5" font-weight="700" fill="${fade?tx:(dark?'#fff':'#0f172a')}" font-family="Inter">${se.n}<tspan fill="${tx}" font-family="JetBrains Mono" font-weight="500"> ${se.vals[se.vals.length-1]}</tspan></text>`;
      if(Math.abs(p.yy-ly)>1) s+=`<line x1="${x(rounds)+2}" x2="${x(rounds)+6}" y1="${p.yy}" y2="${p.yy}" stroke="${tx}"/>`;});
    // connector lines from last point to label col
    pts.forEach(p=>{const se=p.se;s+=`<line x1="${x(se.vals.length-1)+4}" x2="${x(rounds)+4}" y1="${y(se.vals[se.vals.length-1])}" y2="${p.yy}" stroke="${dark?'rgba(255,255,255,.12)':'#e2e8f0'}" stroke-dasharray="2 3"/>`;});
  }
  el.innerHTML=s+'</svg>';
}
function spark(vals,col,w=80,h=24,sw=2){const mx=Math.max(...vals),mn=Math.min(...vals);const r=mx-mn||1;return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="overflow-visible"><polyline points="${vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-2-((v-mn)/r)*(h-4)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${w}" cy="${h-2-((vals[vals.length-1]-mn)/r)*(h-4)}" r="2.5" fill="${col}"/></svg>`;}

</script>
