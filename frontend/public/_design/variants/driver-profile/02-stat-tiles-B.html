<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:"#e7ecf3", card:"#ffffff", surface2:"#f1f5f9", border:"#dbe2ec", dark:"#0f172a", medium:"#334155", light:"#586676", faint:"#68758a",
    primary:{DEFAULT:"#f4afc6", dark:"#ee8bac"}, brand:"#f4afc6", onbrand:"#0f172a", ink:"#0f172a", eyebrow:"#be185d", accent:"#db2777",
    gold:"#EAB308", silver:"#94A3B8", bronze:"#C2410C", link:"#374594", ok:"#046c4e", bad:"#b91c1c", warn:"#92400e", fl:"#701aaf", discord:"#5865F2" },
  fontFamily: { sans:["Inter","system-ui","sans-serif"], display:["Archivo","Inter","sans-serif"], mono:["JetBrains Mono","ui-monospace","monospace"] },
  boxShadow: { card:"0 1px 2px rgba(15,23,42,.06), 0 10px 26px -14px rgba(15,23,42,.28)", lift:"0 2px 6px rgba(15,23,42,.08), 0 18px 40px -16px rgba(15,23,42,.34)" }
}}}
</script>
<style>body{background:#e7ecf3;color:#0f172a;font-family:Inter,system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#be185d;font-weight:600}
#mock{padding-top:32px;padding-bottom:32px}</style>
<style>
.num{font-variant-numeric:tabular-nums}
.no-sb::-webkit-scrollbar{display:none}.no-sb{scrollbar-width:none}
</style></head><body class="">
<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">

<div class="overflow-hidden rounded-2xl bg-ink text-white shadow-lift">
  <div class="flex items-center justify-between gap-3 border-b border-white/10 px-5 py-3 sm:px-6">
    <div class="flex items-center gap-2.5"><span class="h-4 w-1 rounded-full" style="background:#F58220"></span><span class="whitespace-nowrap font-display text-sm font-black uppercase tracking-wide">Season 7</span></div>
    <div class="flex rounded-lg bg-white/5 p-0.5 font-mono text-[10px] font-bold uppercase tracking-wider"><span class="whitespace-nowrap rounded-md bg-white px-2.5 py-1 text-ink">Season</span><span class="whitespace-nowrap px-2.5 py-1 text-white/50">All-time</span></div>
  </div>
  <div class="flex snap-x snap-mandatory overflow-x-auto no-sb lg:grid lg:grid-cols-6 lg:overflow-visible">
    <div class="relative w-[44%] shrink-0 snap-start border-r border-white/10 px-5 py-5 sm:w-[30%] lg:w-auto ">
      <div class="font-mono text-[10px] font-bold uppercase tracking-[.18em] text-white/45">Wins</div>
      <div class="mt-2 flex items-center justify-between gap-2">
        <span class="font-display text-[44px] font-black italic leading-none" style="color:#facc15">2</span>
        <span class="relative"><svg viewBox="0 0 56 56" class="h-14 w-14 -rotate-90"><circle cx="28" cy="28" r="22" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/><circle cx="28" cy="28" r="22" fill="none" stroke="#F58220" stroke-width="5" stroke-linecap="round" stroke-dasharray="27.646015351590176 138.23007675795088"/></svg><span class="absolute inset-0 grid place-items-center font-mono text-[10px] font-bold">20%</span></span>
      </div>
      <div class="mt-2 font-mono text-[10px] uppercase tracking-wider text-white/45">20% of starts</div>
      <span class="absolute inset-x-5 bottom-0 h-[3px]" style="background:linear-gradient(90deg,#F58220,transparent)"></span>
    </div><div class="relative w-[44%] shrink-0 snap-start border-r border-white/10 px-5 py-5 sm:w-[30%] lg:w-auto ">
      <div class="font-mono text-[10px] font-bold uppercase tracking-[.18em] text-white/45">Podiums</div>
      <div class="mt-2 flex items-center justify-between gap-2">
        <span class="font-display text-[44px] font-black italic leading-none" style="">4</span>
        <span class="relative"><svg viewBox="0 0 56 56" class="h-14 w-14 -rotate-90"><circle cx="28" cy="28" r="22" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/><circle cx="28" cy="28" r="22" fill="none" stroke="#F58220" stroke-width="5" stroke-linecap="round" stroke-dasharray="55.29203070318035 138.23007675795088"/></svg><span class="absolute inset-0 grid place-items-center font-mono text-[10px] font-bold">40%</span></span>
      </div>
      <div class="mt-2 font-mono text-[10px] uppercase tracking-wider text-white/45">40% of starts</div>
      <span class="absolute inset-x-5 bottom-0 h-[3px]" style="background:linear-gradient(90deg,#F58220,transparent)"></span>
    </div><div class="relative w-[44%] shrink-0 snap-start border-r border-white/10 px-5 py-5 sm:w-[30%] lg:w-auto ">
      <div class="font-mono text-[10px] font-bold uppercase tracking-[.18em] text-white/45">Best Finish</div>
      <div class="mt-2 flex items-center justify-between gap-2">
        <span class="font-display text-[44px] font-black italic leading-none" style="">P1</span>
        
      </div>
      <div class="mt-2 font-mono text-[10px] uppercase tracking-wider text-white/45">10 starts</div>
      <span class="absolute inset-x-5 bottom-0 h-[3px]" style="background:linear-gradient(90deg,#F58220,transparent)"></span>
    </div><div class="relative w-[44%] shrink-0 snap-start border-r border-white/10 px-5 py-5 sm:w-[30%] lg:w-auto ">
      <div class="font-mono text-[10px] font-bold uppercase tracking-[.18em] text-white/45">Avg Finish</div>
      <div class="mt-2 flex items-center justify-between gap-2">
        <span class="font-display text-[44px] font-black italic leading-none" style="">P4.2</span>
        
      </div>
      <div class="mt-2 font-mono text-[10px] uppercase tracking-wider text-white/45">10 in the points</div>
      <span class="absolute inset-x-5 bottom-0 h-[3px]" style="background:linear-gradient(90deg,#F58220,transparent)"></span>
    </div><div class="relative w-[44%] shrink-0 snap-start border-r border-white/10 px-5 py-5 sm:w-[30%] lg:w-auto ">
      <div class="font-mono text-[10px] font-bold uppercase tracking-[.18em] text-white/45">Poles</div>
      <div class="mt-2 flex items-center justify-between gap-2">
        <span class="font-display text-[44px] font-black italic leading-none" style="">1</span>
        
      </div>
      <div class="mt-2 font-mono text-[10px] uppercase tracking-wider text-white/45">best grid P1</div>
      <span class="absolute inset-x-5 bottom-0 h-[3px]" style="background:linear-gradient(90deg,#F58220,transparent)"></span>
    </div><div class="relative w-[44%] shrink-0 snap-start border-r border-white/10 px-5 py-5 sm:w-[30%] lg:w-auto lg:border-r-0">
      <div class="font-mono text-[10px] font-bold uppercase tracking-[.18em] text-white/45">Places Gained</div>
      <div class="mt-2 flex items-center justify-between gap-2">
        <span class="font-display text-[44px] font-black italic leading-none" style="color:#4ade80">+25</span>
        
      </div>
      <div class="mt-2 font-mono text-[10px] uppercase tracking-wider text-white/45">start → finish</div>
      <span class="absolute inset-x-5 bottom-0 h-[3px]" style="background:linear-gradient(90deg,#F58220,transparent)"></span>
    </div>
  </div>
  <div class="grid grid-cols-2 border-t border-white/10 bg-white/[.03] sm:grid-cols-[auto_1fr_1fr]">
    <div class="col-span-2 flex items-center gap-2 px-5 py-3 sm:col-span-1 sm:border-r sm:border-white/10"><span class="rounded px-1.5 py-0.5 font-mono text-[10px] font-black uppercase tracking-wider text-ink" style="background:#facc15">Sprint</span><span class="font-mono text-[10px] uppercase tracking-wider text-white/45">inside the totals</span></div>
    <div class="flex items-baseline gap-3 border-t border-white/10 px-5 py-3 sm:border-t-0 [&:last-child]:border-l [&:last-child]:border-white/10"><span class="font-display text-2xl font-black italic">1</span><span class="font-mono text-[10px] font-bold uppercase tracking-wider text-white/60">Sprint Wins</span></div><div class="flex items-baseline gap-3 border-t border-white/10 px-5 py-3 sm:border-t-0 [&:last-child]:border-l [&:last-child]:border-white/10"><span class="font-display text-2xl font-black italic">2</span><span class="font-mono text-[10px] font-bold uppercase tracking-wider text-white/60">Sprint Podiums</span></div>
  </div>
</div>
<div class="mt-2 flex justify-center gap-1.5 lg:hidden"><span class="h-1.5 w-5 rounded-full bg-ink"></span><span class="h-1.5 w-1.5 rounded-full bg-faint/40"></span><span class="h-1.5 w-1.5 rounded-full bg-faint/40"></span></div>
</main></body></html>
