<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:"#e7ecf3", card:"#ffffff", surface2:"#f1f5f9", border:"#dbe2ec", dark:"#0f172a", medium:"#334155", light:"#586676", faint:"#68758a",
    primary:{DEFAULT:"#f4afc6", dark:"#ee8bac"}, brand:"#f4afc6", onbrand:"#0f172a", ink:"#0f172a", eyebrow:"#be185d", accent:"#db2777",
    gold:"#EAB308", silver:"#94A3B8", bronze:"#C2410C", link:"#374594", ok:"#046c4e", bad:"#b91c1c", warn:"#92400e", fl:"#701aaf", discord:"#5865F2" },
  fontFamily: { sans:["Inter","system-ui","sans-serif"], display:["Archivo","Inter","sans-serif"], mono:["JetBrains Mono","ui-monospace","monospace"] },
  boxShadow: { card:"0 1px 2px rgba(15,23,42,.06), 0 10px 26px -14px rgba(15,23,42,.28)", lift:"0 2px 6px rgba(15,23,42,.08), 0 18px 40px -16px rgba(15,23,42,.34)" }
}}}
</script>
<style>body{background:#e7ecf3;color:#0f172a;font-family:Inter,system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#be185d;font-weight:600}
#mock{padding-top:32px;padding-bottom:32px}</style>
<style>
.num{font-variant-numeric:tabular-nums}
.no-sb::-webkit-scrollbar{display:none}.no-sb{scrollbar-width:none}
</style></head><body class="">
<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">

<div class="mx-auto max-w-[900px]">
  <div class="flex items-center gap-2 overflow-x-auto no-sb">
    <span class="shrink-0 font-mono text-[10px] font-bold uppercase tracking-wider text-light">Season</span>
    <span class="shrink-0 rounded-lg px-2.5 py-1 font-mono text-[11px] font-bold bg-card text-medium shadow-card">S7</span><span class="shrink-0 rounded-lg px-2.5 py-1 font-mono text-[11px] font-bold bg-card text-medium shadow-card">S6</span><span class="shrink-0 rounded-lg px-2.5 py-1 font-mono text-[11px] font-bold bg-card text-medium shadow-card">S5</span><span class="shrink-0 rounded-lg px-2.5 py-1 font-mono text-[11px] font-bold bg-card text-medium shadow-card">S4</span><span class="shrink-0 rounded-lg px-2.5 py-1 font-mono text-[11px] font-bold bg-ink text-white">S3</span><span class="shrink-0 rounded-lg px-2.5 py-1 font-mono text-[11px] font-bold text-faint line-through">S2</span>
  </div>
  <div class="mt-3 flex items-start gap-3 rounded-2xl border border-warn/30 bg-[#fef3c7] p-4">
    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-white text-warn"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
    <div class="min-w-0 flex-1"><div class="font-display font-black uppercase text-dark">No Season 3 for Siggsta</div><div class="text-sm text-medium">First season: S4 (Jaguar). Struck seasons have no entry.</div></div>
    <a class="hidden shrink-0 rounded-xl bg-ink px-3 py-2 font-mono text-[10px] font-bold uppercase text-white sm:block">Jump to S4 →</a>
  </div>
  <div class="relative mt-4 overflow-hidden rounded-2xl bg-card p-5 opacity-60 shadow-card">
    <div class="flex items-center gap-4"><span class="h-16 w-12 rounded-lg bg-surface2"></span><div class="flex-1 space-y-2"><div class="h-6 w-40 rounded bg-surface2"></div><div class="h-3 w-24 rounded bg-surface2"></div></div></div>
    <div class="mt-4 grid grid-cols-3 gap-2"><div class="h-14 rounded-xl bg-surface2"></div><div class="h-14 rounded-xl bg-surface2"></div><div class="h-14 rounded-xl bg-surface2"></div></div>
    <div class="absolute inset-0 grid place-items-center"><span class="rounded-full bg-card px-3 py-1.5 font-mono text-[10px] font-bold uppercase tracking-wider text-light shadow-card">no data · season 3</span></div>
  </div>
  <a class="mt-3 block rounded-xl bg-ink py-3 text-center font-mono text-[11px] font-bold uppercase text-white sm:hidden">Jump to S4 →</a>
</div>
</main></body></html>
