<main id="mock" class="max-w-[1200px] mx-auto px-4 sm:px-8">

    <a class="rounded-xl border border-border px-4 py-2.5 font-mono text-[11px] font-bold uppercase tracking-wider text-medium">All drivers of Season 3</a>
