<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Two icon looks, on purpose. The browser TAB gets the round pink disc on
         a transparent square (rel="icon" below) — tabs keep transparency, so it
         stays a disc. Google search, Android and iOS instead crop icons into
         their own round frame, and the old transparent corners showed up there
         as a white ring around the disc; those surfaces get the full-bleed pink
         square (apple-touch-icon + favicon.png + the manifest icons), which
         fills their circle completely. Google picks the largest icon it finds,
         so the 180px full-bleed wins over the 64px tab disc there. /favicon.ico
         (the disc) stays unlinked as the root fallback old browsers probe.
         ?v=3 so browsers holding older files refetch. -->
    <link rel="icon" type="image/png" href="/icon-round-32.png?v=3" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-round-64.png?v=3" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <!-- Lets members keep the league on their phone's home screen and open it
         without browser chrome (the site is used weekly, mostly on a phone). -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="NABS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Fonts are self-hosted (public/fonts), no Google servers involved. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>NABS Racing League</title>
    <!-- The fallback description. Pages with something more specific to say get
         this rewritten by the server before it goes out (see
         backend/src/lib/pageMeta.js): the home page adds the race night, a
         driver page names the driver. This text is what the rest fall back to,
         and what the frontend dev server (which serves index.html untouched)
         shows. Deliberately makes no claim that can go stale: no season, no
         race day. The server adds the race night because it reads it off the
         calendar, which nothing typed in here could do. -->
    <meta name="description" content="Formula 1 sim racing league on Assetto Corsa. Online F1 championship with driver and team standings, results, live timing and open sign-ups." />
    <meta name="theme-color" content="#F4AFC6" />
    <!-- Link previews (Discord, WhatsApp, …). og:image must be an ABSOLUTE URL;
         if the site ever moves to another domain, update it below
         (see DEPLOYMENT.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NABS Racing League" />
    <meta property="og:title" content="NABS Racing League" />
    <meta property="og:description" content="Formula 1 sim racing league on Assetto Corsa. Online F1 championship with driver and team standings, results, live timing and open sign-ups." />
    <meta property="og:url" content="https://nabsracing.com/" />
    <meta property="og:image" content="https://nabsracing.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NABS Racing League" />
    <meta name="twitter:description" content="Formula 1 sim racing league on Assetto Corsa. Online F1 championship with driver and team standings, results, live timing and open sign-ups." />
    <meta name="twitter:image" content="https://nabsracing.com/og-image.jpg" />
    <script>
      // Apply saved/system theme before paint to avoid a flash.
      (function () {
        try {
          var s = localStorage.getItem("nabs_theme");
          var dark = s ? s === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
